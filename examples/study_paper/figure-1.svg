<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="520" height="340" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>Figure 1 (self-drawn example): average cell area vs PDT, twelve wells, three donors</title>
  <rect width="520" height="340" fill="#ffffff"/>
  <!-- axes -->
  <line x1="60" y1="280" x2="480" y2="280" stroke="#333" stroke-width="1.2"/>
  <line x1="60" y1="280" x2="60" y2="30" stroke="#333" stroke-width="1.2"/>
  <text x="270" y="318" text-anchor="middle">Average cell area on day 2 (µm²)</text>
  <text x="18" y="160" text-anchor="middle" transform="rotate(-90 18 160)">PDT, day 2–9 (h)</text>
  <!-- x ticks 1000..3000 -->
  <g stroke="#333" stroke-width="1">
    <line x1="60" y1="280" x2="60" y2="286"/><line x1="165" y1="280" x2="165" y2="286"/><line x1="270" y1="280" x2="270" y2="286"/><line x1="375" y1="280" x2="375" y2="286"/><line x1="480" y1="280" x2="480" y2="286"/>
  </g>
  <g text-anchor="middle" fill="#333">
    <text x="60" y="300">1000</text><text x="165" y="300">1500</text><text x="270" y="300">2000</text><text x="375" y="300">2500</text><text x="480" y="300">3000</text>
  </g>
  <!-- y ticks 20..70 -->
  <g stroke="#333" stroke-width="1">
    <line x1="54" y1="280" x2="60" y2="280"/><line x1="54" y1="230" x2="60" y2="230"/><line x1="54" y1="180" x2="60" y2="180"/><line x1="54" y1="130" x2="60" y2="130"/><line x1="54" y1="80" x2="60" y2="80"/><line x1="54" y1="30" x2="60" y2="30"/>
  </g>
  <g text-anchor="end" fill="#333">
    <text x="48" y="284">20</text><text x="48" y="234">30</text><text x="48" y="184">40</text><text x="48" y="134">50</text><text x="48" y="84">60</text><text x="48" y="34">70</text>
  </g>
  <!-- fitted line (illustrative) -->
  <line x1="80" y1="245" x2="470" y2="75" stroke="#b3315f" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- donor A: circles -->
  <g fill="#2c7a69">
    <circle cx="95" cy="238" r="6"/><circle cx="130" cy="225" r="6"/><circle cx="150" cy="212" r="6"/><circle cx="180" cy="200" r="6"/>
  </g>
  <!-- donor B: squares -->
  <g fill="#4675ad">
    <rect x="214" y="176" width="12" height="12"/><rect x="250" y="160" width="12" height="12"/><rect x="285" y="150" width="12" height="12"/><rect x="310" y="128" width="12" height="12"/>
  </g>
  <!-- donor C: triangles -->
  <g fill="#c47322">
    <polygon points="350,118 344,130 356,130"/><polygon points="390,100 384,112 396,112"/><polygon points="420,96 414,108 426,108"/><polygon points="455,78 449,90 461,90"/>
  </g>
  <!-- legend -->
  <g font-size="11" fill="#333">
    <circle cx="380" cy="40" r="5" fill="#2c7a69"/><text x="392" y="44">Donor A</text>
    <rect x="375" y="52" width="10" height="10" fill="#4675ad"/><text x="392" y="61">Donor B</text>
    <polygon points="380,68 375,78 385,78" fill="#c47322"/><text x="392" y="78">Donor C</text>
    <line x1="372" y1="92" x2="388" y2="92" stroke="#b3315f" stroke-width="2" stroke-dasharray="6 4"/><text x="392" y="96">Fitted line</text>
  </g>
  <text x="470" y="330" text-anchor="end" font-size="10" fill="#777">Self-drawn example figure, not from any paper</text>
</svg>
